<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
        .splash { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #000000 0%, #1A0003 100%); border-radius: 20px; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 2px solid #D4AF37; box-sizing: border-box; }
        .logo { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin-bottom: 2rem; border: 4px solid #D4AF37; box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); }
        .loader { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-left-color: #D4AF37; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="splash">
        <img src="logo.png" class="logo" alt="MM Brothers Logo" onerror="this.style.display='none'">
        <h1 style="margin:0 0 1rem 0; font-size:2rem; letter-spacing:1px;">MM Brothers Islamic Mart</h1>
        <p style="color:#D4AF37; margin:0 0 2rem 0; font-weight:bold;">Initializing Local Database...</p>
        <div class="loader"></div>
    </div>
</body>
</html>
